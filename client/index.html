<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />

    <!--
      Favicon do monograma CB, gerado a partir de marca/azul/monograma.png.
      Vai com o bege do site por baixo em vez de transparente: a aba do Chrome
      em tema escuro e cinza-grafite, e o azul da marca sobre transparente
      quase some ali.
      O campo Favicon do painel (seo.favicon) sobrescreve isto em runtime, pelo
      SeoHead — estes servem de base e aparecem antes do JS carregar.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FDFAF6" />
    <title>Dra. Camilla Barros | Dentista na Enseada do Sua, Vitoria ES</title>
    <meta
      name="description"
      content="Consultorio odontologico na Enseada do Sua, Vitoria ES. Lentes em porcelana e resina, clareamento, gengivoplastia, limpeza e placa para bruxismo."
    />

    <!--
      As metas abaixo sao reescritas no build por scripts/prerender.js, com o
      conteudo que estiver no painel. Elas precisam existir aqui como
      marcadores: o prerender substitui por regex, nao insere do zero.
      O WhatsApp e o Facebook leem so o HTML estatico — sem isto, o link
      compartilhado sai sem titulo nem imagem.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dra. Camilla Barros | Dentista na Enseada do Sua, Vitoria ES" />
    <meta
      property="og:description"
      content="Consultorio odontologico na Enseada do Sua, Vitoria ES. Lentes em porcelana e resina, clareamento, gengivoplastia, limpeza e placa para bruxismo."
    />
    <meta property="og:url" content="https://dracamillabarros.com" />
    <meta property="og:image" content="" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dra. Camilla Barros | Dentista na Enseada do Sua, Vitoria ES" />
    <meta
      name="twitter:description"
      content="Consultorio odontologico na Enseada do Sua, Vitoria ES. Lentes em porcelana e resina, clareamento, gengivoplastia, limpeza e placa para bruxismo."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
